name: Rebuild the championship list

# When a championship file is added or replaced in data/, rebuild data/index.json (the Champ Library).
on:
  push:
    branches: [main]
    paths: ["data/*.web.json"]

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data/index.json
        run: python tools/make_index.py
      - name: Commit the list if it changed
        run: |
          if [ -n "$(git status --porcelain data/index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/index.json
            git commit -m "Update championship list"
            git push
          fi
